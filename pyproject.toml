[project]
name = "ad4tj-metadata"
version = "0.1.0"
description = "Disclosure-safe dataset profiling for the Admin Data for Tax Justice workflow"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=7.0", "ruff>=0.4", "openpyxl>=3.1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# CONFIG block sits above imports on purpose so researchers see it first.
"profile_dataset.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
